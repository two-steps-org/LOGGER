name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Publish to private PyPI
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.TWOSTEPS_PYPI_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.TWOSTEPS_PYPI_PASSWORD }}
        run: uv publish --index twosteps-pypi

