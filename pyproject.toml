[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "custom_logger"
version = "1.0.0"
description = "Custom structured logger library for Elasticsearch with monthly indices"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Twosteps"}
]
keywords = ["logging", "elasticsearch", "custom_logger", "twosteps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "elasticsearch>=8.0.0,<9.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_logger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=custom_logger --cov-report=term-missing"

[tool.uv.sources]
custom_logger = { index = "twosteps-pypi" }
